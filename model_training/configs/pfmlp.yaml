output:
  experiment_name: pfmlp_Ptx52dBm

data:
  path: data/pfmlp_Ptx52dBm.mat
  mat_data_key: training_dataset
  val_split: 0.1
  feature_columns: [distance, angle_norm, distance, angle_norm]

model:
  name: SimpleMLPFusion
  params:
    input_dim: 4
    hidden_dims: [128, 64]
    output_dim: 2
    dropout: 0

training:
  device: cuda:0
  loss_function:
    name: MSELoss
  optimizer: AdamW
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 128
  epochs: 100
  scheduler:
    patience: 10
    factor: 0.5
  early_stopping:
    patience: 20

env:
  seed: 42
