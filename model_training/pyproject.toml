[project]
name = "pta-multistatic-uav-localization"
version = "1.0.0"
description = "Training code of PF-MLP and SF-CNN for PTA-enabled multistatic UAV localization"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5",
    "numpy",
    "scipy",
    "h5py",
    "pyyaml",
    "matplotlib",
    "tqdm",
    "thop",
    "onnx",
    "onnxruntime<1.24; python_version < '3.11'",
    "onnxruntime; python_version >= '3.11'",
]
